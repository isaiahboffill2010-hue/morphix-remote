# Morphix PrusaSlicer profile: Afinia QD330, PLA, 0.2 mm layers.
#
# !!! UNVERIFIED !!! Every value here is a GUESS for the Afinia QD330 (FlashForge-family
# firmware v2.1.3). Nothing has been compared with the official Afinia slicer. In
# particular start_gcode/end_gcode and gcode_flavor are generic Marlin-style and are
# very likely wrong for this printer: replace them with the preamble/epilogue found in
# an official Afinia-exported .gx (see docs/PHASE3.md, "Validating against a real .gx").
#
# Used by packages/slicing (sliceStl) as: prusa-slicer --export-gcode --load <this file> ...
# Kept in sync with QD330_PLA_DEFAULTS in packages/slicing/src/profiles.ts (a test checks it).

printer_technology = FFF
# Build volume from the printer's M115 report (220 x 220 x 220 mm), not the official spec.
bed_shape = -110x-110,110x-110,110x110,-110x110
max_print_height = 220
nozzle_diameter = 0.4
gcode_flavor = marlin
use_relative_e_distances = 0
use_firmware_retraction = 0
retract_length = 1
retract_speed = 30
retract_lift = 0
z_offset = 0.1

filament_type = PLA
filament_diameter = 1.75
filament_density = 1.24
extrusion_multiplier = 1
temperature = 210
first_layer_temperature = 210
bed_temperature = 60
first_layer_bed_temperature = 60
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
disable_fan_first_layers = 1

layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
infill_every_layers = 1
seam_position = aligned

# Supports: off by default; sliceStl adds --support-material --support-material-auto
# when supports = "auto" is requested.
support_material = 0
support_material_auto = 1
support_material_threshold = 45
support_material_buildplate_only = 0

skirts = 1
skirt_distance = 6
skirt_height = 1
brim_width = 0

perimeter_speed = 40
external_perimeter_speed = 30
small_perimeter_speed = 25
infill_speed = 60
solid_infill_speed = 50
top_solid_infill_speed = 30
support_material_speed = 50
bridge_speed = 30
gap_fill_speed = 30
travel_speed = 120
first_layer_speed = 20

complete_objects = 0
gcode_comments = 0
gcode_label_objects = disabled
output_filename_format = {input_filename_base}.gcode
start_gcode = ; Morphix start G-code for the Afinia QD330 (FlashForge-family, centre-origin bed -110..110). UNVERIFIED until compared with an official Afinia .gx\nM140 S[first_layer_bed_temperature] T0\nM104 S[first_layer_temperature] T0\nM107\nG90\nM82\nG28\nG1 Z30 F600\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature] T0\nG92 E0\nG1 X-100 Y-100 F3000\nG1 Z0.4 F600\nG1 X0 Y-100 E10 F900\nG92 E0
end_gcode = ; Morphix end G-code (UNVERIFIED)\nM104 S0 T0\nM140 S0\nM107\nG91\nG1 E-2 F1800\nG1 Z10 F600\nG90\nG28 X Y\nM84
