<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QD330 Control</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1b1f24; --muted: #5f6b7a; --line: #dfe3e8;
    --accent: #2563eb; --accent-text: #ffffff; --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
    --chip: #eef1f5; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --card: #171b21; --text: #e6e9ee; --muted: #9aa5b4; --line: #2a313b;
      --accent: #3b82f6; --accent-text: #ffffff; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
      --chip: #222832;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px;
           border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  .pill { padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--chip); }
  .pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
  header .spacer { flex: 1; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; gap: 16px;
         grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 650; }
  .wide { grid-column: 1 / -1; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row + .row { margin-top: 10px; }
  button, .btn { appearance: none; border: 1px solid var(--line); background: var(--chip); color: var(--text);
           padding: 8px 14px; border-radius: 8px; font: inherit; font-weight: 550; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: progress; }
  input[type=number], input[type=text], select, textarea {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; min-width: 0; }
  input[type=number] { width: 90px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .stat { background: var(--chip); border-radius: 10px; padding: 10px 12px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: 13px; color: var(--muted); font-weight: 500; }
  .bar { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; margin-top: 12px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .4s; }
  .muted { color: var(--muted); font-size: 13px; }
  .cam { width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 8px; object-fit: contain; display: block; }
  ul.files { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow: auto; }
  ul.files li { display: flex; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
  ul.files li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.files button { padding: 4px 10px; font-size: 13px; }
  pre#log { font: 12.5px/1.5 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
            padding: 10px; height: 200px; overflow: auto; margin: 10px 0 0; white-space: pre-wrap; word-break: break-word; }
  textarea { width: 100%; font-family: var(--mono); font-size: 13px; }
  .switch { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
  @media (max-width: 520px) { main { padding: 12px; } header { padding: 12px; } }
</style>
</head>
<body>
<header>
  <h1>Afinia QD330</h1>
  <span id="state" class="pill">connecting…</span>
  <span class="spacer"></span>
  <span id="file" class="muted"></span>
</header>

<main>
  <section class="card">
    <h2>Status</h2>
    <div class="stats">
      <div class="stat"><div class="k">Nozzle</div><div class="v" id="t-noz">–</div></div>
      <div class="stat"><div class="k">Bed</div><div class="v" id="t-bed">–</div></div>
      <div class="stat"><div class="k">Progress</div><div class="v" id="prog">–</div></div>
      <div class="stat"><div class="k">Layer</div><div class="v" id="layer">–</div></div>
    </div>
    <div class="bar"><div id="bar"></div></div>
    <p class="muted" id="pos" style="margin:10px 0 0">Position –</p>
  </section>

  <section class="card">
    <h2>Camera</h2>
    <img id="cam" class="cam" alt="Printer camera">
    <div class="row" style="margin-top:10px">
      <button id="cam-toggle">Pause video</button>
      <a class="btn" id="cam-snap" target="_blank" rel="noopener">Snapshot</a>
    </div>
  </section>

  <section class="card">
    <h2>Job</h2>
    <div class="row">
      <button data-act="pause">Pause</button>
      <button data-act="resume">Resume</button>
      <button data-act="cancel" class="danger" data-confirm="Cancel the current print?">Cancel</button>
    </div>
    <div class="row">
      <button data-act="home" class="primary">Home all axes</button>
      <button data-act="motors-off">Motors off</button>
      <button data-act="dance">Dance 🕺</button>
    </div>
  </section>

  <section class="card">
    <h2>Temperature &amp; lights</h2>
    <div class="row">
      <label for="noz-in" style="width:56px">Nozzle</label>
      <input type="number" id="noz-in" min="0" max="260" value="210"> °C
      <button data-temp="nozzle">Set</button>
    </div>
    <div class="row">
      <label for="bed-in" style="width:56px">Bed</label>
      <input type="number" id="bed-in" min="0" max="110" value="60"> °C
      <button data-temp="bed">Set</button>
    </div>
    <div class="row">
      <button data-act="cooldown">Cool down</button>
      <button data-act="fan" data-on="1">Fan on</button>
      <button data-act="fan" data-on="0">Fan off</button>
      <button data-act="led" data-on="1">Light on</button>
      <button data-act="led" data-on="0">Light off</button>
    </div>
  </section>

  <section class="card">
    <h2>Files on printer</h2>
    <ul class="files" id="files"><li class="muted">Loading…</li></ul>
    <div class="row" style="margin-top:12px">
      <input type="file" id="up-file" accept=".gx,.g,.gcode" style="flex:1;min-width:0">
    </div>
    <div class="row">
      <label class="switch"><input type="checkbox" id="up-start"> Start printing after upload</label>
      <button id="up-btn" class="primary">Upload</button>
    </div>
    <p class="muted" id="up-msg" style="margin:8px 0 0"></p>
  </section>

  <section class="card">
    <h2>G-code console</h2>
    <textarea id="gc" rows="3" placeholder="One command per line, e.g. M115"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="gc-send" class="primary">Send</button>
      <span class="muted">Sent with the printer's "~" prefix automatically.</span>
    </div>
    <pre id="log"></pre>
  </section>
</main>

<script>
const qs = new URLSearchParams(location.search);
let token = qs.get("token") || "";
try { if (token) localStorage.setItem("qd330token", token); else token = localStorage.getItem("qd330token") || ""; } catch (e) {}
const withTok = u => token ? u + (u.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token) : u;
const $ = id => document.getElementById(id);

function log(line) {
  const el = $("log");
  el.textContent += `[${new Date().toLocaleTimeString()}] ${line}\n`;
  el.scrollTop = el.scrollHeight;
}

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), ...(token ? { "X-Token": token } : {}) } });
  const data = await res.json().catch(() => ({ error: res.statusText }));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

async function action(name, body, btn) {
  if (btn) btn.disabled = true;
  try {
    const r = await api("/api/action/" + name, { method: "POST", body: JSON.stringify(body || {}) });
    const text = Object.entries(r.reply || {}).map(([k, v]) => `${k} → ${v || "ok"}`).join("\n");
    log(`${name}: ${text || "ok"}`);
  } catch (e) { log(`${name} failed: ${e.message}`); }
  finally { if (btn) btn.disabled = false; refresh(); }
}

document.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
  const body = b.dataset.on !== undefined ? { on: b.dataset.on === "1" } : {};
  action(b.dataset.act, body, b);
}));
document.querySelectorAll("[data-temp]").forEach(b => b.addEventListener("click", () => {
  const which = b.dataset.temp;
  action(which, { temp: Number($(which === "nozzle" ? "noz-in" : "bed-in").value) }, b);
}));

const fmtT = t => t ? `${t.current.toFixed(0)}°<small> / ${t.target.toFixed(0)}°</small>` : "–";
async function refresh() {
  try {
    const s = await api("/api/status");
    const st = $("state");
    if (!s.online) { st.textContent = "offline"; st.className = "pill bad"; $("file").textContent = s.error || ""; return; }
    st.textContent = s.machine.replaceAll("_", " ").toLowerCase();
    st.className = "pill " + (s.machine === "READY" ? "ok" : s.machine.includes("BUILDING") ? "warn" : "");
    $("file").textContent = s.file ? "File: " + s.file : "";
    $("t-noz").innerHTML = fmtT(s.temps.nozzle);
    $("t-bed").innerHTML = fmtT(s.temps.bed);
    $("prog").textContent = s.progress + "%";
    $("bar").style.width = s.progress + "%";
    $("layer").textContent = s.layer[1] ? `${s.layer[0]} / ${s.layer[1]}` : "–";
    const p = s.position;
    $("pos").textContent = `Position  X ${p.x ?? "–"}  Y ${p.y ?? "–"}  Z ${p.z ?? "–"}  ·  ${s.move || ""}`;
  } catch (e) {
    $("state").textContent = "error"; $("state").className = "pill bad"; $("file").textContent = e.message;
  }
}

async function loadFiles() {
  const ul = $("files");
  try {
    const { files } = await api("/api/files");
    ul.innerHTML = "";
    if (!files.length) ul.innerHTML = '<li class="muted">No files</li>';
    files.forEach(f => {
      const li = document.createElement("li");
      const name = document.createElement("span"); name.textContent = f; name.title = f;
      const btn = document.createElement("button"); btn.textContent = "Print";
      btn.onclick = () => { if (confirm(`Start printing ${f}?`)) action("print", { file: f }, btn); };
      li.append(name, btn); ul.append(li);
    });
  } catch (e) { ul.innerHTML = `<li class="muted">Could not load files: ${e.message}</li>`; }
}

$("up-btn").onclick = async () => {
  const f = $("up-file").files[0];
  if (!f) { $("up-msg").textContent = "Choose a .gx or .g file first."; return; }
  const start = $("up-start").checked ? 1 : 0;
  $("up-btn").disabled = true; $("up-msg").textContent = `Uploading ${f.name}…`;
  try {
    await api(`/api/upload?name=${encodeURIComponent(f.name)}&start=${start}`, { method: "POST", body: f });
    $("up-msg").textContent = `Uploaded ${f.name}` + (start ? " and started printing." : ".");
    log(`uploaded ${f.name}`); loadFiles();
  } catch (e) { $("up-msg").textContent = "Upload failed: " + e.message; }
  finally { $("up-btn").disabled = false; refresh(); }
};

$("gc-send").onclick = () => {
  const cmd = $("gc").value.trim();
  if (cmd) action("gcode", { cmd }, $("gc-send"));
};
$("gc").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("gc-send").click(); });

let camOn = true;
function setCam() {
  $("cam").src = camOn ? withTok("/camera/stream") : withTok("/camera/snapshot?t=" + Date.now());
  $("cam-toggle").textContent = camOn ? "Pause video" : "Resume video";
}
$("cam-toggle").onclick = () => { camOn = !camOn; setCam(); };
$("cam-snap").href = withTok("/camera/snapshot");

setCam(); refresh(); loadFiles();
setInterval(refresh, 3000);
</script>
</body>
</html>
